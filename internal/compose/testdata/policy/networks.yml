name: policy
services:
  aliased:
    image: nginx:1.27
    networks:
      default:
        aliases:
          - web.example.com
  ipv4:
    image: nginx:1.27
    networks:
      default:
        ipv4_address: 192.0.2.10
  ipv6:
    image: nginx:1.27
    networks:
      default:
        ipv6_address: "2001:db8::10"
  mac:
    image: nginx:1.27
    networks:
      default:
        mac_address: "02:42:ac:11:00:02"
  other:
    image: nginx:1.27
    networks:
      default:
        link_local_ips:
          - 169.254.169.254
