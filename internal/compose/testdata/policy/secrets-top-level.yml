name: policy
services:
  web:
    image: nginx:1.27
    secrets:
      - labelsgood
      - namegood
      - drvbad
      - optsbad
      - tmplbad
secrets:
  labelsgood:
    environment: TOKEN
    labels:
      team: example
  namegood:
    environment: TOKEN
    name: custom-name
  drvbad:
    file: ./missing.txt
    driver: example
  optsbad:
    file: ./missing.txt
    driver_opts:
      foo: bar
  tmplbad:
    file: ./missing.txt
    template_driver: golang
