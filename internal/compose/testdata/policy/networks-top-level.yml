name: policy
services:
  web:
    image: nginx:1.27
    networks:
      - default
      - shared
      - other
      - extra
      - opts
      - driver
      - subnet
      - ipamdriver
      - custom
networks:
  default:
    labels:
      team: example
    internal: true
    attachable: true
    enable_ipv4: true
    enable_ipv6: true
    driver: bridge
    ipam: {}
  shared:
    external: true
    name: outhaul
  other:
    external: true
    name: host
  extra:
    external: true
    name: elsewhere
  opts:
    driver_opts:
      foo: bar
  driver:
    driver: overlay
  subnet:
    ipam:
      config:
        - subnet: 10.0.0.0/24
  ipamdriver:
    ipam:
      driver: default
  custom:
    name: my-network
